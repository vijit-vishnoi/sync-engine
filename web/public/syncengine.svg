<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Deep charcoal background matching your Lobby UI -->
  <rect width="100" height="100" rx="22" fill="#161616" />
  
  <!-- Gradient transitioning from "Sync" (White) to "Engine" (Darker Blue) -->
  <defs>
    <linearGradient id="syncGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#005ce6" />
    </linearGradient>
  </defs>

  <!-- The Geometric 'S' Data Stream -->
  <path d="M 70 30 L 35 30 L 35 50 L 65 50 L 65 70 L 30 70" 
        fill="none" 
        stroke="url(#syncGrad)" 
        stroke-width="12" 
        stroke-linejoin="round" 
        stroke-linecap="round"/>

  <!-- Client Node 1 (White) -->
  <circle cx="70" cy="30" r="6" fill="#161616" stroke="#ffffff" stroke-width="3"/>
  
  <!-- Client Node 2 (Darker Blue) -->
  <circle cx="30" cy="70" r="6" fill="#161616" stroke="#005ce6" stroke-width="3"/>
</svg>
